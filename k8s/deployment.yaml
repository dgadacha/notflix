# Notflix deployment.
#
# All Notflix config lives in env vars (NOTFLIX_*) — there's no config.toml
# layer like the seanime ancestor had. Non-sensitive values come from the
# ConfigMap (`notflix-config`); API keys come from the Secret (`notflix-secrets`).
# An initContainer chowns the PVC mount to uid 999 so the runtime user
# can write its SQLite + caches.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notflix
  namespace: notflix
  labels:
    app: notflix
spec:
  replicas: 1
  # SQLite on a RWO PVC — one pod at a time. Recreate avoids the
  # "rolling update tries to bind the PVC twice" race during deploys.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: notflix
  template:
    metadata:
      labels:
        app: notflix
    spec:
      imagePullSecrets:
        - name: gitlab-registry
      # PVC ownership fix — runtime container is uid 999, but the PVC
      # comes up root-owned on first mount. Without this, sqlite/cache
      # writes 500 with EACCES and the pod CrashLoopBackOffs.
      initContainers:
        - name: chown-data
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 999:999 /data && chmod 0755 /data"]
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: notflix
          image: registry.gitlab.com/kidnar/notflix:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 43000
              name: http
          envFrom:
            - configMapRef:
                name: notflix-config
            - secretRef:
                name: notflix-secrets
          env:
            # Pin to /data which is the PVC mount. Backend also reads
            # NOTFLIX_SERVER_HOST + _PORT, set in the ConfigMap.
            - name: NOTFLIX_DATA_DIR
              value: /data
          volumeMounts:
            - name: data
              mountPath: /data
          # TCP probes — embedded HTTP handler doesn't expose /healthz
          # but a successful TCP accept on 43000 means the binary is
          # past config init.
          readinessProbe:
            tcpSocket:
              port: 43000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 43000
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              # Parallel downloads + ffmpeg + Claude translation can spike
              # CPU. 1.5Gi covers the worst case we've measured.
              memory: "1500Mi"
              cpu: "2000m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: notflix-data
---
# ConfigMap — non-sensitive runtime config. Override individual values
# with `kubectl edit cm notflix-config -n notflix` and restart the pod.
apiVersion: v1
kind: ConfigMap
metadata:
  name: notflix-config
  namespace: notflix
data:
  NOTFLIX_SERVER_HOST: "0.0.0.0"
  NOTFLIX_SERVER_PORT: "43000"
  NOTFLIX_PROWLARR_URL: "http://prowlarr.media.svc.cluster.local:9696"
  NOTFLIX_ANTHROPIC_MODEL: "claude-haiku-4-5"
---
# Secret — API keys + admin credentials.
#
# DO NOT COMMIT REAL VALUES. Edit on the cluster:
#   kubectl edit secret notflix-secrets -n notflix
# Or apply via a sealed-secrets / external-secrets operator if you have one.
#
# These keys can ALSO be set / rotated at runtime via the admin
# Settings UI — env vars are the bootstrap; the SQLite settings table
# wins after first save.
apiVersion: v1
kind: Secret
metadata:
  name: notflix-secrets
  namespace: notflix
type: Opaque
stringData:
  NOTFLIX_TMDB_API_KEY: ""
  NOTFLIX_TORBOX_API_KEY: ""
  NOTFLIX_PROWLARR_API_KEY: ""
  NOTFLIX_ANTHROPIC_API_KEY: ""
  NOTFLIX_ADMIN_USERNAME: "admin"
  NOTFLIX_ADMIN_PASSWORD: "change-me-after-first-login"
