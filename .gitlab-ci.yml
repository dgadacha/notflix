# GitLab CI/CD for Notflix
#
# Two stages:
#   1. build  — compile the multi-stage Docker image, push to the project's
#               own registry (registry.gitlab.com/kidnar/notflix) tagged with
#               the commit SHA + the branch name (+ notflix-vX.Y.Z when on a
#               matching tag).
#   2. deploy — kubectl rollout the new image into the `notflix` namespace via
#               the GitLab agent for Kubernetes (configured in
#               .gitlab/agents/notflix/config.yaml).
#
# Collaborators can push to main and the deployed pod updates automatically.
# No SSH to the salon node required.

stages:
  - build
  - deploy

variables:
  IMAGE: $CI_REGISTRY_IMAGE                      # registry.gitlab.com/kidnar/notflix
  KUBE_CONTEXT: kidnar/notflix:notflix           # <project-path>:<agent-name>

# -----------------------------------------------------------------------------
# Build the docker image (uses Docker-in-Docker on the self-hosted salon runner)
# -----------------------------------------------------------------------------
build:image:
  stage: build
  tags: [salon]                                  # self-hosted runner on the salon node
  image: docker:27.3
  services:
    - docker:27.3-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker pull "$IMAGE:latest" 2>/dev/null || true     # warm the layer cache
    - docker build
        --cache-from "$IMAGE:latest"
        --tag "$IMAGE:$CI_COMMIT_SHORT_SHA"
        --tag "$IMAGE:$CI_COMMIT_REF_SLUG"
        $( [ "$CI_COMMIT_TAG" ] && echo "--tag $IMAGE:$CI_COMMIT_TAG" )
        $( [ "$CI_COMMIT_REF_NAME" = "main" ] && echo "--tag $IMAGE:latest" )
        .
    - docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$IMAGE:$CI_COMMIT_REF_SLUG"
    - if [ "$CI_COMMIT_TAG" ];               then docker push "$IMAGE:$CI_COMMIT_TAG"; fi
    - if [ "$CI_COMMIT_REF_NAME" = "main" ]; then docker push "$IMAGE:latest";        fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^notflix-v/'

# -----------------------------------------------------------------------------
# Deploy via the GitLab Kubernetes agent — namespace-scoped, no SSH needed
# -----------------------------------------------------------------------------
deploy:k8s:
  stage: deploy
  tags: [salon]                                  # same self-hosted runner
  # Bitnami tags by patch version, not by minor — `1.31` doesn't resolve.
  # Override the entrypoint: the image ENTRYPOINT is `kubectl`, which makes
  # GitLab Runner's `sh -c ...` invocation fail with `unknown command "sh"`.
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  needs: ["build:image"]
  before_script:
    - kubectl config use-context $KUBE_CONTEXT
    - kubectl version --client=true --output=yaml
  script:
    # Apply only the namespace-scoped manifests (the agent's RBAC is bound
    # to a Role inside `notflix`, on purpose — it can't touch cluster-wide
    # resources like Namespace itself, and shouldn't need to: the namespace
    # is created once at infra setup time and lives forever).
    - kubectl apply -f k8s/pvc.yaml
    - kubectl apply -f k8s/service.yaml
    - kubectl apply -f k8s/ingress.yaml
    - kubectl apply -f k8s/deployment.yaml
    # Force the deployment to use this exact build (the Deployment manifest
    # references :latest — we bump to the SHA-tagged image so the rollout
    # actually pulls something new).
    - kubectl -n notflix set image deployment/notflix notflix=$IMAGE:$CI_COMMIT_SHORT_SHA
    - kubectl -n notflix rollout status deployment/notflix --timeout=180s
  environment:
    name: production
    url: https://notflix.maiz.lan
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^notflix-v/'
